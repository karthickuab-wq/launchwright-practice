<meta name="mockup-app" content="Usewell">
<meta name="mockup-title" content="Usewell mockup">
<meta name="mockup-kind" content="new">
<meta name="mockup-flow" content="today recipe cooked">
<style>
/* The design guide: Calm and airy. Sage, mint, cream; "use today" red only for today. */
.app {
  --bg: #FBFAF6; --surface: #F1F3EC; --ink: #1F2A22; --muted: #66706A; --line: #E3E6DE;
  --accent: #3F7A5A; --accent-ink: #FFFFFF; --accent-soft: #E5F1E8;
  --warn: #B2452C; --warn-soft: #F8E6E0; --amber: #8A5A00; --amber-soft: #FBF1DA; --good: #2F6B45; --good-soft: #E5F1E8;
  --radius: 18px; --title: 30px;
}
.uw-hero { height: 156px; margin: 4px 0 16px; background: radial-gradient(circle at 30% 30%, #F4E9C9 0, #E9D9AE 45%, #D9C38D 100%); }
.uw-hero.big { height: 214px; background: radial-gradient(circle at 70% 25%, #E5F1E8 0, #CFE5D6 50%, #B9D7C3 100%); }
.uw-hero em { font-style: normal; filter: drop-shadow(0 4px 6px rgba(0,0,0,.12)); }
.uw-rec { width: 100%; border: 0; padding: 0; text-align: left; background: var(--surface); border-radius: var(--radius); overflow: hidden; font: inherit; color: var(--ink); }
.uw-rec .uw-hero { margin: 0; border-radius: 0; height: 128px; font-size: 40px; position: relative; }
.uw-rec .uw-uses { position: absolute; left: 12px; bottom: 10px; font-size: 13px; font-weight: 650; background: rgba(255,255,255,.92); color: var(--good); border-radius: 999px; padding: 4px 10px; }
.uw-rec .tx { padding: 12px 14px 14px; }
.uw-rec b { display: block; font-size: 18px; }
.uw-rec small { color: var(--muted); font-size: 14px; }
.uw-ok { width: 76px; height: 76px; margin: 26px auto 14px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; }
.uw-scan { position: relative; height: 260px; border-radius: var(--radius); background: #2B3530; overflow: hidden; margin: 6px 0 12px; display: grid; place-items: center; }
.uw-receipt { width: 168px; background: #FFFDF6; padding: 14px 12px; font: 12px/1.55 ui-monospace, Menlo, Consolas, monospace; color: #3A3A3A; transform: rotate(-3deg); box-shadow: 0 8px 18px rgba(0,0,0,.3); }
.uw-frame { position: absolute; inset: 24px 54px; border: 3px solid rgba(255,255,255,.9); border-radius: 18px; }
.uw-found { margin: 0 0 4px; }
.uw-price { background: var(--accent-soft); border-radius: var(--radius); padding: 16px; margin: 16px 0 4px; }
.uw-price b { font-size: 30px; }
.uw-tick { list-style: none; padding: 0; margin: 8px 0 0; }
.uw-tick li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; }
.uw-tick li::before { content: "✓"; flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 13px; font-weight: 800; display: grid; place-items: center; margin-top: 1px; }
.uw-stepper { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-radius: var(--radius); padding: 8px 8px 8px 14px; margin: 0 0 10px; }
.uw-stepper .v b { display: block; } .uw-stepper .v small { color: var(--muted); font-size: 14px; }
.uw-stepper .ctl { display: flex; gap: 6px; }
.uw-stepper .ctl button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; color: var(--ink); }
.uw-back { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 650; min-height: 44px; padding: 0; display: inline-flex; align-items: center; gap: 4px; }
</style>

<template data-screen="welcome" data-name="Welcome" data-group="Getting started" data-about="First open, and sign-in">
  <div class="a-pad">
    <div class="a-hero uw-hero big"><em>🥬</em><em>🧀</em><em>🍋</em><em>🥛</em></div>
    <h1 class="a-title">Cook what you have, before it goes off.</h1>
    <p class="a-sub">Scan your receipt once. Usewell tells you what to use first, and what to make with it.</p>
    <button class="a-btn dark" data-go="today" data-note="Signs in with Apple in one tap, then opens Today. The sign-in method is a question for later.">Continue with Apple</button>
    <button class="a-btn ghost" style="margin-top:8px" data-go="today" data-note="Signs in with Google in one tap, then opens Today.">Continue with Google</button>
    <p class="a-sub a-center" style="font-size:14px;margin-top:14px">No password to remember.</p>
  </div>
</template>

<template data-screen="today" data-name="Today" data-group="Main flow" data-about="What to use first, and tonight's idea">
  <div class="a-pad">
    <p class="a-eyebrow">Tuesday evening</p>
    <h1 class="a-title">Use these first</h1>
    <p class="a-sub">4 things go off in the next two days.</p>
    <button class="a-row" data-go="item" data-note="Opens the spinach, to change its date or mark it used."><span class="a-ic" style="background:#E5F1E8">🥬</span><span class="m"><b>Spinach</b><small>1 bag</small></span><span class="a-tag today">Tomorrow</span></button>
    <button class="a-row" data-go="item" data-note="Opens the chicken, to change its date or mark it used."><span class="a-ic" style="background:#FBF1DA">🍗</span><span class="m"><b>Chicken thighs</b><small>4 pieces</small></span><span class="a-tag soon">2 days</span></button>
    <button class="a-row" data-go="item" data-note="Opens the yogurt, to change its date or mark it used."><span class="a-ic" style="background:#EEF1F6">🥛</span><span class="m"><b>Greek yogurt</b><small>Half a pot</small></span><span class="a-tag soon">2 days</span></button>
    <button class="a-row" data-go="item" data-note="Opens the lemon, to change its date or mark it used."><span class="a-ic" style="background:#FBF6D8">🍋</span><span class="m"><b>Lemon</b><small>Half</small></span><span class="a-tag">4 days</span></button>
    <h2 class="a-h2">Tonight, in 15 minutes</h2>
    <button class="uw-rec" data-go="recipe" data-note="Opens tonight's recipe, which uses three of your things.">
      <div class="a-hero uw-hero"><em>🍗</em><em>🥬</em><em>🍋</em><span class="uw-uses">Uses 3 of yours</span></div>
      <div class="tx"><b>Lemony chicken &amp; spinach</b><small>15 min · serves 2</small></div>
    </button>
  </div>
  <nav class="a-tabs">
    <button aria-current="page" data-go="today" data-note="What to use first, and tonight's idea. You're here."><span class="i" data-icon="sun"></span>Today</button>
    <button data-go="kitchen" data-note="Your kitchen: everything you have, by when to use it."><span class="i" data-icon="list"></span>Kitchen</button>
    <button data-go="add" data-note="Opens the scanner: scan a receipt, or type what you bought."><span class="i" data-icon="plus"></span>Add</button>
    <button data-go="remind" data-note="Opens your reminders and the Plus plan."><span class="i" data-icon="settings"></span>Settings</button>
  </nav>
</template>

<template data-screen="recipe" data-name="Recipe" data-group="Main flow" data-about="Steps, and what it uses">
  <div class="a-pad">
    <button class="uw-back" data-go="back" data-note="Goes back to the screen before.">‹ Back</button>
    <div class="a-hero uw-hero" style="font-size:56px"><em>🍗</em><em>🥬</em><em>🍋</em></div>
    <h1 class="a-title" style="font-size:26px">Lemony chicken &amp; spinach</h1>
    <p class="a-sub">15 min · serves 2</p>
    <h2 class="a-h2" style="margin-top:4px">Uses yours</h2>
    <div class="a-chips"><span>Chicken thighs</span><span>Spinach</span><span>Lemon</span></div>
    <h2 class="a-h2">You'll also need</h2>
    <div class="a-chips"><span class="need">Garlic</span><span class="need">Olive oil</span><span class="need">Salt and pepper</span></div>
    <h2 class="a-h2">Steps</h2>
    <ol class="a-steps">
      <li>Brown the chicken in a hot pan with a little oil, 6 minutes each side.</li>
      <li>Add two sliced garlic cloves for 1 minute, then the spinach until it wilts.</li>
      <li>Squeeze over the lemon. Season, and serve with any bread you have.</li>
    </ol>
  </div>
  <div class="a-foot"><button class="a-btn" data-go="cooked" data-note="Marks the chicken, spinach and lemon as used, and shows what you saved.">I cooked it</button></div>
</template>

<template data-screen="cooked" data-name="Cooked" data-group="Main flow" data-about="What you saved">
  <div class="a-pad">
    <div class="uw-ok"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#3F7A5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg></div>
    <h1 class="a-title a-center" style="font-size:27px">Nice. 3 things used up.</h1>
    <p class="a-sub a-center">That's about $9 of food you didn't throw away this week.</p>
    <h2 class="a-h2">Still to use</h2>
    <button class="a-row" data-go="item" data-note="Opens the yogurt, to change its date or mark it used."><span class="a-ic" style="background:#EEF1F6">🥛</span><span class="m"><b>Greek yogurt</b><small>Half a pot</small></span><span class="a-tag soon">2 days</span></button>
    <div class="a-notif"><span class="ap"></span><div><b>Tomorrow, 6 pm</b><p>I'll remind you about the yogurt, with a 5‑minute idea.</p></div></div>
    <button class="a-btn ghost" data-go="today" data-note="Goes back to Today.">Back to Today</button>
  </div>
</template>

<template data-screen="item" data-name="An item" data-group="Your kitchen" data-about="Change the date, or mark it used">
  <div class="a-pad">
    <button class="uw-back" data-go="back" data-note="Goes back to the screen before.">‹ Back</button>
    <div style="display:flex;align-items:center;gap:14px;margin:8px 0 18px"><span class="a-ic" style="width:64px;height:64px;font-size:34px;border-radius:18px;background:#E5F1E8">🥬</span><div><h1 class="a-title" style="font-size:26px;margin:0">Spinach</h1><p class="a-sub" style="margin:0">Bought Saturday · Fresh Mart</p></div></div>
    <div class="uw-stepper"><div class="v"><b>Use by tomorrow</b><small>Wednesday 19 November</small></div><div class="ctl"><button data-note="Moves the use-by date a day earlier." aria-label="A day earlier">−</button><button data-note="Moves the use-by date a day later." aria-label="A day later">+</button></div></div>
    <div class="uw-stepper"><div class="v"><b>1 bag</b><small>How much is left</small></div><div class="ctl"><button data-note="Less left." aria-label="Less">−</button><button data-note="More left." aria-label="More">+</button></div></div>
    <h2 class="a-h2">Ideas with spinach</h2>
    <button class="a-row" data-go="recipe" data-note="Opens this recipe."><span class="a-ic" style="background:#FBF1DA">🍗</span><span class="m"><b>Lemony chicken &amp; spinach</b><small>15 min · uses 3 of yours</small></span></button>
    <button class="a-btn" data-go="today" data-note="Marks the spinach as used and takes it off your list.">I used it</button>
    <button class="a-btn ghost" style="margin-top:8px" data-go="today" data-note="Takes it off your list without counting it as used. No guilt, no stats.">It went off</button>
  </div>
</template>
